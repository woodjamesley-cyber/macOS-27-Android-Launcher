name: Android CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew || true

      - name: Build debug APK
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew --no-daemon :app:assembleDebug
          else
            gradle --no-daemon :app:assembleDebug
          fi

      - name: Build signed release APK (only when signing secrets exist)
        env:
          SIGNING_STORE_FILE: ${{ secrets.SIGNING_STORE_FILE }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_STORE_FILE" ] && [ -n "$SIGNING_STORE_PASSWORD" ] \
             && [ -n "$SIGNING_KEY_ALIAS" ] && [ -n "$SIGNING_KEY_PASSWORD" ]; then
            echo "$SIGNING_STORE_FILE" | base64 -d > "$RUNNER_TEMP/release.jks"
            export SIGNING_STORE_FILE="$RUNNER_TEMP/release.jks"
            ./gradlew --no-daemon :app:assembleRelease
          else
            echo "No signing secrets configured — shipping the debug-signed APK instead."
          fi

      - name: Verify APK metadata
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/aapt2" dump badging "$APK" | grep -E "^package:|targetSdkVersion|application-label:"
          COUNT=$("$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK" | grep -c "android.intent.category.HOME" || true)
          echo "HOME intent filter entries: $COUNT"
          if [ "$COUNT" -lt 1 ]; then
            echo "::error::Packaged manifest is missing android.intent.category.HOME — this cannot be a Home app."
            exit 1
          fi
          ls -lh "$APK"

      - name: Collect APKs
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/GoldenGateDesktop-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk artifacts/GoldenGateDesktop-release.apk
          fi
          ls -lh artifacts

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoldenGateDesktop-apk
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: ignore

      - name: Attach APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          fail_on_unmatched_files: false
